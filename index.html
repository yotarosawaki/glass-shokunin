<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2b211b">
<title>めざせ！ガラス職人</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6e9;--ink:#4a3428;--paper:#fffdf8;--accent:#e8613c;--blue:#3b7dd8;--muted:#8a7565;--green:#4caf6a;--yellow:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2b211b}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.btn{font:inherit;font-weight:800;font-size:18px;border:3px solid var(--ink);border-radius:18px;padding:12px 18px;background:var(--yellow);color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer;touch-action:manipulation;transition:transform .05s}
.btn:active,.btn.on{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.blue{background:#8fd3f4}.btn.red{background:#ff9a76}.btn.white{background:#fff}.btn.green{background:#9be0a8}
.btn.small{font-size:15px;padding:8px 12px;border-radius:14px;box-shadow:0 4px 0 var(--ink)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.wide{width:100%}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:14px;box-shadow:0 4px 0 rgba(74,52,40,.25)}
h1,h2,h3{margin:0}
.chibi{display:block;width:100%;height:auto}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}

/* title */
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:28px 20px calc(28px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 38%,#ffe3b8 0,#fff6e9 55%,#f3dfc4 100%)}
.logo{text-align:center}
.logo .sub{font-size:14px;font-weight:800;letter-spacing:.15em;color:var(--accent)}
.logo h1{font-size:44px;line-height:1.1;margin-top:6px;color:#2f6fb8;text-shadow:3px 3px 0 #fff,5px 5px 0 var(--ink);letter-spacing:.02em}
.logo .tag{margin-top:10px;font-size:13px;font-weight:800;background:var(--ink);color:#fff;display:inline-block;padding:4px 12px;border-radius:99px}
.hero{width:min(300px,80vw)}
.titlebtns{display:flex;flex-direction:column;gap:14px;width:100%;max-width:320px}

/* dialog */
.dlg{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 16px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(#f6e7d2,#ecd5b6);cursor:pointer}
.dlg .who{width:210px;margin:0 auto -10px;animation:bob 2.4s ease-in-out infinite}
.dlg .box{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:22px 18px 18px;font-size:18px;font-weight:800;line-height:1.6;min-height:130px}
.dlg .name{position:absolute;top:-16px;left:16px;background:var(--accent);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:2px 12px;font-size:14px}
.dlg .next{position:absolute;right:14px;bottom:8px;font-size:13px;color:var(--muted);animation:blink 1s infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes blink{50%{opacity:.2}}

/* header */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:3px solid var(--ink);background:#ffe9c7}
.topbar h2{font-size:18px}

/* select */
.pcard{display:flex;gap:12px;align-items:center;cursor:pointer;position:relative}
.pcard canvas{width:96px;height:77px;flex:none;background:#f4ecdf;border-radius:14px;border:2px solid rgba(74,52,40,.2)}
.pcard .lv{font-size:13px;color:var(--accent);font-weight:800}
.pcard h3{font-size:19px}
.pcard p{margin:4px 0 0;font-size:13px;line-height:1.45;color:var(--muted)}
.pcard .best{position:absolute;top:-10px;right:-6px;width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}
.pcard.locked{opacity:.55;filter:grayscale(.7)}
.rankS{color:#e0a100}.rankA{color:#e8613c}.rankB{color:#3b7dd8}.rankC{color:#4caf6a}.rankD{color:#8a7565}

/* order */
.order{background:#fff;border:3px solid var(--ink);border-radius:8px;padding:16px;position:relative;box-shadow:6px 6px 0 rgba(74,52,40,.2)}
.order .stamp{position:absolute;right:12px;top:10px;border:3px solid #d0453a;color:#d0453a;border-radius:50%;width:58px;height:58px;display:grid;place-items:center;font-weight:800;font-size:13px;transform:rotate(-12deg);line-height:1.1;text-align:center}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.chip{border:2.5px solid var(--ink);border-radius:99px;padding:4px 10px;font-size:14px;font-weight:800;background:#fff}
.chip.done{background:#9be0a8}.chip.now{background:var(--yellow)}
.arrow{font-weight:800;color:var(--muted)}
.talk{display:flex;gap:10px;align-items:flex-end}
.talk .face{width:76px;flex:none}
.bub{position:relative;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 12px;font-weight:800;font-size:15px;line-height:1.55}
.bub:before{content:"";position:absolute;left:-12px;bottom:14px;border:8px solid transparent;border-right:10px solid var(--ink)}
.bub small{display:block;font-size:12px;color:var(--accent)}

/* tip */
.tipsec{border-top:2px dashed rgba(74,52,40,.25);padding-top:10px;margin-top:10px}
.tipsec b{display:inline-block;font-size:13px;color:#fff;background:var(--ink);border-radius:8px;padding:1px 8px;margin-bottom:4px}
.tipsec.kotsu b{background:var(--accent)}
.tipsec p{margin:2px 0 0;font-size:16px;line-height:1.6;font-weight:800}

/* game */
.ghead{padding:10px 12px 6px;padding-top:calc(10px + env(safe-area-inset-top));background:#ffe9c7;border-bottom:3px solid var(--ink)}
.ghead .flow{margin-top:0;gap:4px}
.ghead .chip{font-size:11px;padding:2px 7px}
.ghead .sname{font-size:17px;font-weight:800;margin-top:6px;display:flex;justify-content:space-between}
.coach{display:flex;align-items:center;gap:8px;padding:6px 12px;min-height:58px}
.coach .face{width:48px;flex:none}
.coach .bub{flex:1;font-size:14px;padding:6px 10px;min-height:38px;display:flex;align-items:center}
.coach .bub:before{bottom:10px}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
.stage canvas{display:block;border-radius:16px;border:3px solid var(--ink);touch-action:none;background:#f6e7d2}
.ctrl{padding:8px 14px calc(14px + env(safe-area-inset-bottom));border-top:3px solid var(--ink);background:#ffe9c7}
.ctrl .how{font-size:13px;font-weight:800;text-align:center;margin-bottom:8px;line-height:1.4}
.ctrl .btns{display:flex;gap:10px}
.ctrl .btns .btn{flex:1;font-size:19px;padding:14px 8px;touch-action:none}
.ctrl .btns .btn.sub{flex:.55;font-size:16px}

/* results */
.score{font-size:64px;font-weight:800;line-height:1;text-align:center}
.score small{font-size:20px}
.stars{text-align:center;font-size:34px;letter-spacing:4px;color:#f2b705;text-shadow:2px 2px 0 var(--ink)}
.stars .off{color:#e6d8c6}
.rankbig{font-size:96px;font-weight:800;line-height:1;text-align:center;text-shadow:4px 4px 0 var(--ink)}
.steplist{width:100%;border-collapse:collapse;font-weight:800;font-size:15px}
.steplist td{padding:6px 4px;border-bottom:2px dashed rgba(74,52,40,.2)}
.steplist td:last-child{text-align:right}
.bar{height:10px;background:#efe3d3;border-radius:6px;overflow:hidden;border:2px solid var(--ink)}
.bar i{display:block;height:100%;background:var(--accent)}
.prodview{display:flex;gap:10px;align-items:stretch}
.prodview canvas{border:3px solid var(--ink);border-radius:16px;background:#f4ecdf;width:100%;height:auto}
.badge{display:inline-block;padding:3px 12px;border-radius:99px;border:3px solid var(--ink);font-weight:800;font-size:15px}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:2px dashed rgba(74,52,40,.2);font-weight:800;gap:10px}
.toggle{width:60px;height:34px;border-radius:99px;border:3px solid var(--ink);background:#ddd;position:relative;flex:none;cursor:pointer}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .15s}
.toggle.on{background:#9be0a8}.toggle.on:after{left:29px}
.fade{animation:fadein .3s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
.pop{animation:popin .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.3);opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ============================================================
   めざせ！ガラス職人  — 池田硝子 新人研修ゲーム
   ============================================================ */
const $=s=>document.querySelector(s);
const app=$('#app');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const L='#4a3428';
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------------- sound ---------------- */
let AC=null,soundOn=store.get('glass_sound',true);
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.12,type='sine',vol=.15,slide=0,delay=0){if(!soundOn)return;const a=ac();if(!a)return;const t0=a.currentTime+delay;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+d+.02)}
let noiseBuf=null;
function getNoise(a){if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*2,a.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return noiseBuf}
function noiseBurst(d=.25,vol=.3,freq=3000){if(!soundOn)return;const a=ac();if(!a)return;const s=a.createBufferSource();s.buffer=getNoise(a);const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=freq;const g=a.createGain();g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);s.connect(f).connect(g).connect(a.destination);s.start();s.stop(a.currentTime+d)}
let hissSrc=null,hissGain=null;
function hiss(level){const a=AC;if(!a)return;if(!hissSrc){if(level<=0)return;hissSrc=a.createBufferSource();hissSrc.buffer=getNoise(a);hissSrc.loop=true;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=900;f.Q.value=.6;hissGain=a.createGain();hissGain.gain.value=0;hissSrc.connect(f).connect(hissGain).connect(a.destination);hissSrc.start()}hissGain.gain.setTargetAtTime(soundOn?level*.06:0,a.currentTime,.06)}
const SFX={
  tap(){tone(660,.08,'triangle',.12)},
  good(){tone(784,.12,'triangle',.14);tone(1046,.2,'triangle',.14,0,.09)},
  perfect(){tone(784,.1,'triangle',.14);tone(988,.1,'triangle',.14,0,.08);tone(1318,.25,'triangle',.14,0,.16)},
  bad(){tone(240,.28,'sawtooth',.07,-90)},
  crack(){noiseBurst(.18,.35,2500);tone(1800,.08,'square',.05,-900)},
  pop(){tone(300,.15,'sine',.2,500)},
  fanfare(){[523,659,784,1046].forEach((f,i)=>tone(f,.22,'triangle',.13,0,i*.12));tone(1318,.5,'triangle',.13,0,.5)},
};

/* ---------------- characters (2D deformed) ---------------- */
function chibi(who,mood='normal'){
  const skin='#ffe2c6';
  const cfg={boss:{jacket:'#46638f',hair:'#d4d4d4'},pres:{jacket:'#eef2f7',hair:'#3a2a22'},me:{jacket:'#5fae73',hair:'#6b4430'}}[who];
  let s=`<svg viewBox="0 0 100 112" xmlns="http://www.w3.org/2000/svg" class="chibi" aria-hidden="true">`;
  s+=`<path d="M20 111 Q20 78 50 76 Q80 78 80 111 Z" fill="${cfg.jacket}" stroke="${L}" stroke-width="3" stroke-linejoin="round"/>`;
  if(who==='pres')s+=`<path d="M41 77 L50 91 L59 77" fill="#fff" stroke="${L}" stroke-width="2.5" stroke-linejoin="round"/><path d="M50 86 L45.5 104 L50 109 L54.5 104 Z" fill="#c0392b" stroke="${L}" stroke-width="2" stroke-linejoin="round"/><path d="M28 92 L36 92" stroke="${L}" stroke-width="2"/>`;
  else if(who==='boss')s+=`<path d="M40 78 L50 89 L60 78" fill="#fff" stroke="${L}" stroke-width="2.5" stroke-linejoin="round"/><rect x="58" y="92" width="12" height="9" rx="2" fill="none" stroke="${L}" stroke-width="2"/>`;
  else s+=`<path d="M40 78 L50 88 L60 78" fill="none" stroke="${L}" stroke-width="2.5" stroke-linejoin="round"/><rect x="29" y="92" width="14" height="8" rx="2" fill="#fff" stroke="${L}" stroke-width="2"/>`;
  s+=`<circle cx="19" cy="49" r="6" fill="${skin}" stroke="${L}" stroke-width="2.5"/><circle cx="81" cy="49" r="6" fill="${skin}" stroke="${L}" stroke-width="2.5"/>`;
  s+=`<circle cx="50" cy="45" r="31" fill="${skin}" stroke="${L}" stroke-width="3"/>`;
  if(who==='boss'){
    s+=`<path d="M20 46 Q16 30 26 22 L31 37 Z" fill="${cfg.hair}" stroke="${L}" stroke-width="2.5" stroke-linejoin="round"/><path d="M80 46 Q84 30 74 22 L69 37 Z" fill="${cfg.hair}" stroke="${L}" stroke-width="2.5" stroke-linejoin="round"/>`;
    s+=`<path d="M21 33 Q50 15 79 33 L79 41 Q50 25 21 41 Z" fill="#fff" stroke="${L}" stroke-width="2.5" stroke-linejoin="round"/><path d="M23 36 Q50 20 77 36" stroke="#3b7dd8" stroke-width="2.5" fill="none"/>`;
    s+=`<ellipse cx="84" cy="34" rx="6" ry="4" fill="#fff" stroke="${L}" stroke-width="2"/><path d="M86 37 L92 45 L86 44 Z" fill="#fff" stroke="${L}" stroke-width="2" stroke-linejoin="round"/>`;
  }else if(who==='pres'){
    s+=`<path d="M18 47 Q14 12 50 12 Q86 12 82 47 Q79 30 66 25 Q52 35 31 28 Q22 34 18 47 Z" fill="${cfg.hair}" stroke="${L}" stroke-width="3" stroke-linejoin="round"/>`;
  }else{
    s+=`<path d="M20 45 Q20 27 30 24 L70 24 Q80 27 80 45 Q72 34 56 36 L50 30 L44 36 Q28 34 20 45 Z" fill="${cfg.hair}" stroke="${L}" stroke-width="2.5" stroke-linejoin="round"/>`;
    s+=`<path d="M21 30 Q22 7 50 7 Q78 7 79 30 Z" fill="#5fae73" stroke="${L}" stroke-width="3" stroke-linejoin="round"/><path d="M17 30 Q50 22 88 31 Q90 36 83 36 Q50 30 17 36 Z" fill="#478f5b" stroke="${L}" stroke-width="2.5" stroke-linejoin="round"/>`;
    s+=`<rect x="31" y="15" width="16" height="10" rx="5" fill="#8fd3f4" stroke="${L}" stroke-width="2.2"/><rect x="53" y="15" width="16" height="10" rx="5" fill="#8fd3f4" stroke="${L}" stroke-width="2.2"/><path d="M47 20 L53 20" stroke="${L}" stroke-width="2.2"/>`;
  }
  // eyes
  const ey=who==='boss'?49:48;
  if(mood==='happy')s+=`<path d="M35 ${ey+1} Q40 ${ey-6} 45 ${ey+1}" fill="none" stroke="${L}" stroke-width="3" stroke-linecap="round"/><path d="M55 ${ey+1} Q60 ${ey-6} 65 ${ey+1}" fill="none" stroke="${L}" stroke-width="3" stroke-linecap="round"/>`;
  else if(mood==='surprise')s+=`<circle cx="40" cy="${ey}" r="4.5" fill="#fff" stroke="${L}" stroke-width="2.5"/><circle cx="60" cy="${ey}" r="4.5" fill="#fff" stroke="${L}" stroke-width="2.5"/><circle cx="40" cy="${ey}" r="1.8" fill="${L}"/><circle cx="60" cy="${ey}" r="1.8" fill="${L}"/>`;
  else s+=`<ellipse cx="40" cy="${ey}" rx="3.2" ry="4.2" fill="${L}"/><ellipse cx="60" cy="${ey}" rx="3.2" ry="4.2" fill="${L}"/><circle cx="41" cy="${ey-1.5}" r="1.2" fill="#fff"/><circle cx="61" cy="${ey-1.5}" r="1.2" fill="#fff"/>`;
  if(mood==='worried')s+=`<path d="M34 ${ey-10} L45 ${ey-7}" stroke="${L}" stroke-width="2.5" stroke-linecap="round"/><path d="M66 ${ey-10} L55 ${ey-7}" stroke="${L}" stroke-width="2.5" stroke-linecap="round"/>`;
  else if(who!=='boss')s+=`<path d="M35 ${ey-9} Q40 ${ey-12} 45 ${ey-9}" fill="none" stroke="${L}" stroke-width="2.2" stroke-linecap="round"/><path d="M55 ${ey-9} Q60 ${ey-12} 65 ${ey-9}" fill="none" stroke="${L}" stroke-width="2.2" stroke-linecap="round"/>`;
  if(who==='boss')s+=`<circle cx="40" cy="49" r="8.5" fill="rgba(255,255,255,.25)" stroke="${L}" stroke-width="2.3"/><circle cx="60" cy="49" r="8.5" fill="rgba(255,255,255,.25)" stroke="${L}" stroke-width="2.3"/><path d="M48.5 49 L51.5 49" stroke="${L}" stroke-width="2.3"/>`;
  s+=`<ellipse cx="31" cy="57" rx="5" ry="3" fill="#ff9f9f" opacity=".55"/><ellipse cx="69" cy="57" rx="5" ry="3" fill="#ff9f9f" opacity=".55"/>`;
  const my=who==='boss'?64:60;
  if(who==='boss')s+=`<path d="M38 60 Q44 55 50 58.5 Q56 55 62 60 Q56 63 50 61 Q44 63 38 60 Z" fill="${cfg.hair}" stroke="${L}" stroke-width="2" stroke-linejoin="round"/>`;
  if(mood==='happy')s+=`<path d="M43 ${my} Q50 ${my+10} 57 ${my} Z" fill="#d9534f" stroke="${L}" stroke-width="2.3" stroke-linejoin="round"/>`;
  else if(mood==='worried')s+=`<path d="M44 ${my+2} Q47 ${my-1} 50 ${my+2} Q53 ${my+5} 56 ${my+2}" fill="none" stroke="${L}" stroke-width="2.3" stroke-linecap="round"/>`;
  else if(mood==='surprise')s+=`<ellipse cx="50" cy="${my+2}" rx="3.5" ry="4.5" fill="#d9534f" stroke="${L}" stroke-width="2.3"/>`;
  else s+=`<path d="M45 ${my} Q50 ${my+5} 55 ${my}" fill="none" stroke="${L}" stroke-width="2.5" stroke-linecap="round"/>`;
  return s+`</svg>`;
}
const NAMES={boss:'工場長',pres:'社長',me:'新人（あなた）'};

/* ---------------- game data ---------------- */
const T_HEAT='heat',T_ROT='rotate',T_BLOW='blow',T_JOIN='join',T_BRANCH='branch',T_COIL='coil',T_ANNEAL='anneal',T_CUT='cut';
const ANNEAL_STEP={type:T_ANNEAL,name:'徐冷（アニール）',what:'加工が終わったらアニール炉に入れ、ゆっくり温度を下げて、加工でガラスにたまった「歪み」を取りのぞく。',kotsu:'炉の温度はすぐには変わらない。目標の線を少し先読みして操作しよう。とくに冷やす区間は急がずゆっくり。',how:'画面を上下になぞって炉の設定温度を操作。点線（目標）に沿わせよう',p:{dur:17}};
const PRODUCTS=[
 {id:'tube',name:'試験管',lv:1,desc:'理化学ガラスの基本。ガラス管を切って、底を丸く閉じる。',order:'実験室で使う試験管の注文です。まずは基本の工程をひと通り覚えましょう。',steps:[

const CW=360,CH=440;
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
const GSTOPS=[[0,[205,236,250,.6]],[.4,[255,178,115,.85]],[.62,[255,138,42,.95]],[.8,[255,212,78,1]],[1,[255,252,228,1]]];
function glassRGB(h){h=clamp(h,0,1);for(let i=1;i<GSTOPS.length;i++){if(h<=GSTOPS[i][0]){const[a,ca]=GSTOPS[i-1],[b,cb]=GSTOPS[i];const k=(h-a)/(b-a);return ca.map((v,j)=>v+(cb[j]-v)*k)}}return GSTOPS[GSTOPS.length-1][1]}
function glassCol(h,am=1){const m=glassRGB(h);return`rgba(${m[0]|0},${m[1]|0},${m[2]|0},${(m[3]*am).toFixed(3)})`}
const FONT=(sz,w=800)=>`${w} ${sz}px "M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif`;
function txt(c,s,x,y,sz=16,col=L,align='center',stroke=null){c.font=FONT(sz);c.textAlign=align;c.textBaseline='middle';if(stroke){c.lineWidth=5;c.strokeStyle=stroke;c.lineJoin='round';c.strokeText(s,x,y)}c.fillStyle=col;c.fillText(s,x,y)}
function label(c,s,x,y,sz=14,bg='#fff',col=L){c.font=FONT(sz);const w=c.measureText(s).width+18;rr(c,x-w/2,y-sz*.8,w,sz*1.6,sz*.8);c.fillStyle=bg;c.fill();c.lineWidth=2.5;c.strokeStyle=L;c.stroke();txt(c,s,x,y+1,sz,col)}
function drawBg(c){
  const g=c.createLinearGradient(0,0,0,CH);g.addColorStop(0,'#f6e7d2');g.addColorStop(1,'#ead2b2');c.fillStyle=g;c.fillRect(0,0,CW,CH);
  c.strokeStyle='rgba(74,52,40,.06)';c.lineWidth=2;for(let y=44;y<380;y+=44){c.beginPath();c.moveTo(0,y);c.lineTo(CW,y);c.stroke()}
  c.fillStyle='#b9825a';c.fillRect(0,380,CW,60);c.fillStyle='#d39a6c';c.fillRect(0,380,CW,9);
  c.strokeStyle=L;c.lineWidth=3;c.beginPath();c.moveTo(0,380);c.lineTo(CW,380);c.stroke();
  c.strokeStyle='rgba(74,52,40,.18)';c.lineWidth=2;for(let x=30;x<CW;x+=70){c.beginPath();c.moveTo(x,395);c.lineTo(x+30,395);c.stroke()}
}
function drawFlame(c,x,y,ang,len,w,t,power=1){
  if(power<=0.01)return;len*=power;w*=Math.max(.5,power);
  const fl=1+.07*Math.sin(t*37)+.05*Math.sin(t*23+1);
  c.save();c.translate(x,y);c.rotate(ang);
  const L1=len*fl;
  let g=c.createLinearGradient(0,0,0,-L1);g.addColorStop(0,'rgba(255,190,110,.9)');g.addColorStop(.55,'rgba(255,110,60,.6)');g.addColorStop(1,'rgba(255,80,60,0)');
  c.beginPath();c.moveTo(-w,0);c.quadraticCurveTo(-w*1.1,-L1*.5,0,-L1);c.quadraticCurveTo(w*1.1,-L1*.5,w,0);c.quadraticCurveTo(0,w*.5,-w,0);c.fillStyle=g;c.fill();
  const L2=len*.48*(1+.05*Math.sin(t*41));
  g=c.createLinearGradient(0,0,0,-L2);g.addColorStop(0,'rgba(60,120,255,.95)');g.addColorStop(1,'rgba(130,190,255,.15)');
  c.beginPath();c.moveTo(-w*.5,0);c.quadraticCurveTo(-w*.55,-L2*.5,0,-L2);c.quadraticCurveTo(w*.55,-L2*.5,w*.5,0);c.closePath();c.fillStyle=g;c.fill();
  c.restore();
}
function drawBurner(c,x,topY,t,power=1,len=95,w=20){
  rr(c,x-30,356,60,26,8);c.fillStyle='#8d99a6';c.fill();c.lineWidth=3;c.strokeStyle=L;c.stroke();

}
function drawBurnerDown(c,x,botY,t,len,power=1){

function tubeH(c,x1,x2,y,r,heat=0,hx=180,hw=60){
  rr(c,x1,y-r,x2-x1,r*2,Math.min(r,10));c.fillStyle=glassCol(0);c.fill();
  if(heat>.02){c.save();c.clip();const g=c.createLinearGradient(hx-hw,0,hx+hw,0);g.addColorStop(0,glassCol(heat,0));g.addColorStop(.5,glassCol(heat));g.addColorStop(1,glassCol(heat,0));c.fillStyle=g;c.fillRect(hx-hw,y-r,hw*2,r*2);c.restore()}
  c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=3;c.lineCap='round';c.beginPath();c.moveTo(x1+10,y-r*.55);c.lineTo(x2-10,y-r*.55);c.stroke();

function thermo(c,x,y,h,v,band,title='温度'){
  rr(c,x-12,y,24,h,12);c.fillStyle='#fff';c.fill();
  if(band){c.fillStyle='rgba(76,175,106,.45)';c.fillRect(x-12,y+h*(1-band[1]),24,h*(band[1]-band[0]))}
  const vv=clamp(v,0,1);const col=vv<band[0]?'#5aa0e6':vv<=band[1]?'#4caf6a':'#e8413c';
  rr(c,x-6,y+h*(1-vv)+2,12,Math.max(4,h*vv-2),6);c.fillStyle=col;c.fill();
  rr(c,x-12,y,24,h,12);c.lineWidth=3;c.strokeStyle=L;c.stroke();
  c.beginPath();c.arc(x,y+h+10,14,0,Math.PI*2);c.fillStyle=col;c.fill();c.stroke();

function crackLines(c,x,y,amt,seed=3){if(amt<=0)return;const r=mulberry(seed);c.save();c.strokeStyle=`rgba(255,255,255,${clamp(amt,0,1)})`;c.lineWidth=2;for(let k=0;k<4;k++){c.beginPath();let px=x+(r()-.5)*40,py=y+(r()-.5)*16;c.moveTo(px,py);for(let i=0;i<4;i++){px+=(r()-.5)*22*amt;py+=(r()-.5)*18*amt;c.lineTo(px,py)}c.stroke()}c.restore()}

  drawFx(c){this.parts.forEach(p=>{c.globalAlpha=clamp(p.life*1.6,0,1);c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,3,0,Math.PI*2);c.fill()});c.globalAlpha=1;

}

/* --- 加熱 --- */
class Heat extends Mini{
  constructor(p){super(p);this.T=.03;this.pos=0;this.hold=false;this.stress=0;this.inBand=0;this.counted=0;this.over=0;this.cracked=false;this.rate=0;this.spin=0}
  down(){this.hold=true}up(){this.hold=false}btn(k,d){if(k==='hold')this.hold=d}
  update(dt){
    const p=this.p;this.t+=dt;this.spin+=dt*5;
    this.pos+=((this.hold?1:0)-this.pos)*Math.min(1,dt*5);
    const heatIn=this.pos*this.pos*.32,cool=(this.T-.03)*.13;
    this.rate=heatIn-cool;this.T=clamp(this.T+this.rate*dt,0,1.15);
    hiss(.4+this.pos*.6);
    if(this.T<.4&&this.rate>p.rateLimit&&!this.cracked){this.stress+=(this.rate-p.rateLimit)*dt*9}else this.stress=Math.max(0,this.stress-dt*.04);
    if(this.stress>=1&&!this.cracked){this.cracked=true;SFX.crack();this.pop('ピキッ！',180,170,'#d0453a',28);coach('あっ…急に熱しすぎて割れが入った！','worried',true)}
    const[lo,hi]=p.band;
    if(this.t>p.warm){this.counted+=dt;if(this.T>=lo&&this.T<=hi)this.inBand+=dt;if(this.T>hi+.1)this.over+=dt}
    if(!this.cracked){
      if(this.T<.4&&this.rate>p.rateLimit*.8)coach('あわてるな！最初は少しずつ炎に入れろ','surprise');
      else if(this.T>hi+.04)coach('熱すぎる！ガラスがダレるぞ','surprise');
      else if(this.T>=lo&&this.T<=hi)coach('いい色だ、その温度をキープ！','happy');
      else if(this.t>p.warm-1&&this.T<lo)coach('もう少し温めていいぞ','normal');
      else if(this.t<2)coach('まずは炎の外側で、あぶるように','normal');
    }
    if(this.t>=p.dur){
      let s=this.counted>0?this.inBand/this.counted*100:0;
      s-=Math.min(1,this.stress)*25;s-=this.over*5;if(this.cracked)s=Math.min(s,25);
      this.finish(s);
    }
  }
  draw(c){
    const p=this.p;drawBg(c);timerBar(c,1-this.t/p.dur);
    drawBurner(c,180,300,this.t,1,100,22);
    const y=lerp(150,250,this.pos);
    tubeH(c,46,286,y,18,this.T,180,lerp(40,70,this.T));
    c.save();rr(c,46,y-18,240,36,10);c.clip();c.strokeStyle='rgba(74,52,40,.13)';c.lineWidth=3;
    for(let i=0;i<9;i++){const xx=46+((i*30+this.spin*18)%270);c.beginPath();c.moveTo(xx,y-18);c.lineTo(xx-10,y+18);c.stroke()}c.restore();
    crackLines(c,180,y,this.stress*.9);
    drawHand(c,46,y,1);drawHand(c,286,y,-1);
    thermo(c,330,70,250,this.T,p.band);
    txt(c,Math.round(20+this.T*1180)+'℃',330,356,14,L,'center','#fff');
    if(this.T<.4&&this.rate>p.rateLimit&&!this.cracked)label(c,'⚠ 急加熱！',110,60,15,'#ffd9cc','#d0453a');
    else if(this.t<p.warm)label(c,'ゆっくり温めよう',110,60,14);
    else label(c,'緑の温度をキープ',110,60,14,'#dff3e3');
  }
}
/* --- 回転 --- */
class Rotate extends Mini{
  constructor(p){super(p);this.v=0;this.sag=0;this.twist=0;this.ang=0;this.inBand=0;this.counted=0;this.trail=[];this.lx=null}
  down(x,y){this.touch=true;this.lx=x;this.ly=y}
  move(x,y){if(!this.touch)return;const d=Math.hypot(x-this.lx,y-this.ly);this.v=Math.min(1.3,this.v+d/360*.42);this.lx=x;this.ly=y;this.trail.push({x,y,life:.4})}
  up(){this.touch=false}
  update(dt){
    const p=this.p;this.t+=dt;this.v*=Math.exp(-1.1*dt);this.ang+=this.v*dt*14;hiss(.7);
    this.trail.forEach(q=>q.life-=dt);this.trail=this.trail.filter(q=>q.life>0);
    const[lo,hi]=p.band;
    if(this.t>1.5){this.counted+=dt;
      if(this.v<lo){this.sag+=(lo-this.v)*dt*.55}else if(this.v>hi){this.twist+=(this.v-hi)*dt*.9}else{this.inBand+=dt;this.sag=Math.max(0,this.sag-dt*.02)}
    }
    if(this.v<lo*.75&&this.t>1.5)coach('回転が遅い！ガラスが垂れてきたぞ','surprise');
    else if(this.v>hi*1.08)coach('速すぎる！ねじれるぞ','surprise');
    else if(this.v>=lo&&this.v<=hi)coach('いいリズムだ、そのまま一定に','happy');
    if(this.t>=p.dur)this.finish((this.counted?this.inBand/this.counted*100:0)-this.sag*45-this.twist*35);
  }
  draw(c){
    const p=this.p;drawBg(c);timerBar(c,1-this.t/p.dur);
    // speed gauge
    const gx=180,gy=150,gr=78,toA=v=>Math.PI+clamp(v/1.1,0,1)*Math.PI;
    c.lineCap='butt';c.lineWidth=18;c.strokeStyle='#fff';c.beginPath();c.arc(gx,gy,gr,Math.PI,0);c.stroke();
    c.strokeStyle='#8fd3a0';c.beginPath();c.arc(gx,gy,gr,toA(p.band[0]),toA(p.band[1]));c.stroke();
    c.lineWidth=3;c.strokeStyle=L;c.beginPath();c.arc(gx,gy,gr+9,Math.PI,0);c.stroke();c.beginPath();c.arc(gx,gy,gr-9,Math.PI,0);c.stroke();
    const a=toA(this.v);c.lineWidth=5;c.lineCap='round';c.beginPath();c.moveTo(gx,gy);c.lineTo(gx+Math.cos(a)*(gr-4),gy+Math.sin(a)*(gr-4));c.stroke();
    c.beginPath();c.arc(gx,gy,8,0,Math.PI*2);c.fillStyle=L;c.fill();
    txt(c,'おそい',gx-gr+4,gy+18,12,'#3b7dd8');txt(c,'はやい',gx+gr-4,gy+18,12,'#d0453a');txt(c,'回転',gx,gy-30,14);
    // tube (bendable)
    const y=262,droop=this.sag*110+(this.v<p.band[0]?Math.sin(this.t*3)*2:0);
    drawBurner(c,180,330,this.t,.8,70,20);
    const path=()=>{c.beginPath();c.moveTo(56,y);c.quadraticCurveTo(180,y+droop*2,304,y)};
    c.lineCap='round';path();c.lineWidth=40;c.strokeStyle=L;c.stroke();path();c.lineWidth=34;c.strokeStyle=glassCol(0,1.3);c.stroke();
    const g=c.createLinearGradient(100,0,260,0);g.addColorStop(0,glassCol(.68,0));g.addColorStop(.5,glassCol(.68));g.addColorStop(1,glassCol(.68,0));path();c.strokeStyle=g;c.stroke();
    c.strokeStyle='rgba(74,52,40,.22)';c.lineWidth=3;
    for(let i=0;i<8;i++){const tt=((i/8+this.ang*.05)%1);const x=56+tt*248;const yy=y+droop*2*2*tt*(1-tt);const sl=6+this.twist*30;c.beginPath();c.moveTo(x-sl,yy-14);c.lineTo(x+sl,yy+14);c.stroke()}
    drawHand(c,56,y,1);drawHand(c,304,y,-1);
    this.trail.forEach(q=>{c.globalAlpha=q.life*1.8;c.beginPath();c.arc(q.x,q.y,10,0,Math.PI*2);c.fillStyle='#fff';c.fill()});c.globalAlpha=1;
    if(this.t<3)label(c,'👆 くるくるなぞって回す',180,198,14);
  }
}
/* --- 吹く --- */
class Blow extends Mini{
  constructor(p){super(p);this.r=p.r0;this.hold=false;this.press=0;this.puffs=[];this.cur=0;this.burst=false;this.uneven=0}
  down(){this.hold=true}up(){this.hold=false}
  btn(k,d){if(k==='hold')this.hold=d;if(k==='done'&&d&&!this.done){if(this.puffs.length===0&&this.cur===0){coach('まだ一度も吹いてないぞ！','surprise',true);return}this.end()}}
  end(){if(this.cur>0){this.puffs.push(this.cur);this.cur=0}
    const p=this.p;if(this.burst){this.finish(10);return}
    const err=Math.abs(this.r-1),size=clamp(100-err/p.tol*45,0,100);
    const even=clamp(100-this.uneven*70,0,100);const s=size*(1-p.even)+even*p.even;
    const[w,col]=judgeWord(s);this.pop(w,250,110,col,26);if(s>=70)SFX.good();this.finish(s)}
  update(dt){
    const p=this.p;this.t+=dt;
    this.press+=((this.hold?1:0)-this.press)*Math.min(1,dt*9);
    const visc=1+this.t/9;
    this.r+=this.press*p.k*Math.pow(this.r,2.2)/visc*dt;
    if(this.hold){this.cur+=dt;if(this.cur>.55)this.uneven+=dt*.9}else if(this.cur>0){this.puffs.push(this.cur);this.cur=0}
    if(this.r>=p.burst&&!this.burst){this.burst=true;SFX.pop();this.spark(250,230,24,'#bfe6f7');coach('パン！ 吹きすぎて割れてしまった…','worried',true);this.hold=false;setTimeout(()=>this.end(),400)}
    if(!this.burst){
      if(this.hold&&this.cur>.55)coach('長く吹きすぎ！短く区切って','surprise');
      else if(this.r>1+p.tol)coach('大きすぎる！','surprise');
      else if(Math.abs(this.r-1)<p.tol*.5)coach('ぴったりだ！「完成」を押せ','happy');
      else if(this.r>.9)coach('もうすぐだ、ちょっとずつな','normal');
      else if(this.t>3)coach('ガラスが冷める前に吹くんだ','normal');
    }
    if(this.t>=p.dur&&!this.done)this.end();
  }
  draw(c){
    const p=this.p;drawBg(c);timerBar(c,1-this.t/p.dur,'冷める');
    const cy=232,puff=this.press;
    // blower chibi
    const fx=46,fy=128;
    c.lineWidth=3;c.strokeStyle=L;
    c.beginPath();c.moveTo(fx+22,fy+16);c.bezierCurveTo(fx+40,fy+70,30,cy,p.shape==='dome'?60:84,cy);c.lineWidth=8;c.strokeStyle='#b5562e';c.stroke();
    c.beginPath();c.arc(fx,fy,28,0,Math.PI*2);c.fillStyle='#ffe2c6';c.fill();c.lineWidth=3;c.strokeStyle=L;c.stroke();
    c.beginPath();c.arc(fx,fy-12,28,Math.PI*1.05,Math.PI*1.95);c.lineTo(fx+28,fy-12);c.fillStyle='#5fae73';c.fill();c.stroke();
    c.fillStyle=L;c.beginPath();c.ellipse(fx-8,fy-2,2.5,3.5,0,0,Math.PI*2);c.ellipse(fx+10,fy-2,2.5,3.5,0,0,Math.PI*2);c.fill();
    const ch=5+puff*6;c.fillStyle='rgba(255,150,150,.7)';c.beginPath();c.arc(fx-14,fy+8,ch,0,Math.PI*2);c.arc(fx+16,fy+8,ch,0,Math.PI*2);c.fill();
    c.beginPath();c.arc(fx+3,fy+12,3+puff*2,0,Math.PI*2);c.fillStyle='#d9534f';c.fill();c.stroke();
    if(puff>.3){c.strokeStyle='rgba(74,52,40,.4)';c.lineWidth=2;for(let i=0;i<3;i++){const o=(this.t*60+i*12)%36;c.beginPath();c.moveTo(fx+30+o,fy+10-i*6);c.lineTo(fx+38+o,fy+10-i*6);c.stroke()}}
    if(p.shape==='bottom'){

      const rr2=R*this.r;
      c.save();c.beginPath();c.ellipse(xe,cy,Math.max(10,rr2*.95),Math.max(R,rr2),0,-Math.PI/2,Math.PI/2);c.closePath();
      c.fillStyle=glassCol(.66);c.fill();c.lineWidth=3;c.strokeStyle=L;c.stroke();c.restore();
      const wall=clamp(16/(this.r*this.r)-6,3,14);c.save();c.beginPath();c.ellipse(xe,cy,Math.max(4,rr2*.95-wall*(1+this.uneven*.5)),Math.max(R,rr2)-wall,0,-Math.PI/2,Math.PI/2);c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=2.5;c.stroke();c.restore();

      c.setLineDash([7,6]);c.beginPath();c.arc(x0+R*.92,cy,R,0,Math.PI*2);c.lineWidth=3;c.strokeStyle='#2f6fb8';c.stroke();c.setLineDash([]);
      label(c,'ドームの型',x0+R*.92,cy-R-18,12,'#e3f1ff');
      c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=4;c.lineCap='round';c.beginPath();c.arc(bx,cy,br*.75,Math.PI*1.15,Math.PI*1.45);c.stroke();
    }
    txt(c,'大きさ '+Math.round(this.r*100)+'%',300,370,14,Math.abs(this.r-1)<=p.tol?'#2e8b57':L,'center','#fff');
    // puffs log
    const evenTxt=this.uneven<.25?'均一':this.uneven<.7?'ややムラ':'ムラあり';
    label(c,'肉厚：'+evenTxt,90,370,13,this.uneven<.25?'#dff3e3':'#ffe3d6');
  }
}
/* --- 接合（封じ/溶接/板付け） --- */
class Join extends Mini{
  constructor(p){super(p);this.i=0;this.res=[];this.newJoint()}
  newJoint(){this.T=0;this.spd=this.p.speed*rand(.78,1.25);this.phase='heat';this.wait=0;this.slide=0}
  down(){this.tap()}btn(k,d){if(k==='tap'&&d)this.tap()}
  tap(){
    if(this.phase!=='heat'||this.T<.08)return;
    const[a,b]=this.p.sweet,c=(a+b)/2,h=(b-a)/2,d=Math.abs(this.T-c);
    let s=d<=h?100-d/h*22:Math.max(0,78-(d-h)/.22*78);
    if(this.T<a-.15)s=Math.min(s,25);
    this.res.push(s);this.phase='joined';this.wait=1;this.lastS=s;
    const[w,col]=judgeWord(s);this.pop(w,180,150,col,26);
    if(s>=90)SFX.perfect();else if(s>=70)SFX.good();else SFX.bad();
    this.spark(this.jx||180,this.jy||230,s>=70?16:6);
    if(this.T<a)coach('早すぎる！まだ溶けてないぞ','surprise',true);else if(this.T>b)coach('遅い！ダレかけてたぞ','surprise',true);else coach(s>=90?'完璧な色だ！':'いい色だ！','happy',true);
  }
  update(dt){
    this.t+=dt;
    if(this.phase==='heat'){hiss(.9);this.T+=this.spd*dt*(.55+this.T*.9);
      if(this.T>=1){this.res.push(0);this.phase='fail';this.wait=1.1;SFX.bad();this.pop('ダレた…',180,150,'#8a7565',24);coach('溶けすぎてダレた！もっと早く','worried',true)}}
    else{hiss(.3);this.slide=Math.min(1,this.slide+dt*5);this.wait-=dt;if(this.wait<=0){this.i++;if(this.i>=this.p.count){this.finish(this.res.reduce((a,b)=>a+b,0)/this.res.length)}else this.newJoint()}}

    const k=p.kind,joined=this.phase==='joined';

  }
}
/* --- 枝付け（偏芯） --- */
class Branch extends Mini{
  constructor(p){super(p);this.i=0;this.res=[];this.theta=rand(0,6);this.phi0=rand(0,6);this.round()}
  round(){const p=this.p;this.phi=this.phi0+this.i*Math.PI/2;this.dir=this.i%2?-1:1;this.w=p.speed*(1+.18*this.i);this.rt=0;this.phase='spin';this.R=66;
    const e=p.ecc,R=this.R;this.rho=Math.sqrt(e*e+R*R+2*e*R*Math.cos(this.phi-0));this.off=Math.atan2(R*Math.sin(this.phi),e+R*Math.cos(this.phi))}
  markAng(){return this.theta+this.off}

  const fcx=$('#fin').getContext('2d');const conf=[];if(rk==='S'||rk==='A')for(let i=0;i<60;i++)conf.push({x:rand(0,300),y:rand(-240,0),v:rand(40,90),c:['#ffd166','#e8613c','#8fd3f4','#9be0a8'][i%4],r:rand(0,6)});
  const t0=performance.now();
  const loop=ts=>{const t=(ts-t0)/1000;fcx.setTransform(2,0,0,2,0,0);fcx.clearRect(0,0,300,240);drawProduct(fcx,pd.id,q,t,avg);
    conf.forEach(p=>{p.y+=p.v/60;p.r+=.1;if(p.y>250)p.y=-10;fcx.save();fcx.translate(p.x+Math.sin(t*2+p.r)*8,p.y);fcx.rotate(p.r);fcx.fillStyle=p.c;fcx.fillRect(-4,-2,8,4);fcx.restore()});
    finalRaf=requestAnimationFrame(loop)};finalRaf=requestAnimationFrame(loop);
  $('#sel').onclick=()=>{SFX.tap();screenSelect()};
  $('#again').onclick=()=>{SFX.tap();S.stepIdx=0;S.scores=[];screenTip()};
}
