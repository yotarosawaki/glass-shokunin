<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#24323d">
<title>めざせ！ガラスのプロ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7fa;--ink:#3d3a40;--paper:#fffefb;--accent:#e8613c;--blue:#2f78c4;--muted:#7d7a85;--green:#3fae6a;--yellow:#ffd166;--head:#dff0fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#24323d}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.btn{font:inherit;font-weight:800;font-size:18px;border:3px solid var(--ink);border-radius:18px;padding:12px 18px;background:var(--yellow);color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer;touch-action:manipulation;transition:transform .05s}
.btn:active,.btn.on{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.blue{background:#8fd3f4}.btn.red{background:#ff9a76}.btn.white{background:#fff}.btn.green{background:#9be0a8}
.btn.small{font-size:15px;padding:8px 12px;border-radius:14px;box-shadow:0 4px 0 var(--ink)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.wide{width:100%}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:14px;box-shadow:0 4px 0 rgba(61,58,64,.2)}
h1,h2,h3{margin:0}
.chibi{display:block;width:100%;height:auto}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:28px 20px calc(28px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 40%,#ffffff 0,#e6f3fb 55%,#cfe3ef 100%)}
.logo{text-align:center}
.logo .sub{font-size:14px;font-weight:800;letter-spacing:.12em;color:var(--blue)}
.logo h1{font-size:44px;line-height:1.1;margin-top:6px;color:#2f78c4;text-shadow:3px 3px 0 #fff,5px 5px 0 var(--ink)}
.logo .tag{margin-top:10px;font-size:13px;font-weight:800;background:var(--ink);color:#fff;display:inline-block;padding:4px 12px;border-radius:99px}
.hero{width:min(320px,84vw)}
.titlebtns{display:flex;flex-direction:column;gap:14px;width:100%;max-width:320px}
.dlg{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 16px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(#e9f1f6,#cfdbe3);cursor:pointer}
.dlg .who{width:210px;margin:0 auto -10px;animation:bob 2.4s ease-in-out infinite}
.dlg .box{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:22px 18px 18px;font-size:18px;font-weight:800;line-height:1.6;min-height:130px}
.dlg .name{position:absolute;top:-16px;left:16px;background:var(--accent);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:2px 12px;font-size:14px}
.dlg .next{position:absolute;right:14px;bottom:8px;font-size:13px;color:var(--muted);animation:blink 1s infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes blink{50%{opacity:.2}}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:3px solid var(--ink);background:var(--head)}
.topbar h2{font-size:18px}
.pcard{display:flex;gap:12px;align-items:center;cursor:pointer;position:relative}
.pcard canvas{width:96px;height:77px;flex:none;background:#eaf1f5;border-radius:14px;border:2px solid rgba(61,58,64,.15)}
.pcard .lv{font-size:13px;color:var(--accent);font-weight:800}
.pcard .fac{display:inline-block;font-size:11px;font-weight:800;background:#e3f1ff;border:2px solid var(--ink);border-radius:8px;padding:0 6px;margin-left:4px;color:var(--ink)}
.pcard h3{font-size:18px}
.pcard p{margin:4px 0 0;font-size:13px;line-height:1.45;color:var(--muted)}
.pcard .best{position:absolute;top:-10px;right:-6px;width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}
.pcard.locked{opacity:.55;filter:grayscale(.7)}
.rankS{color:#e0a100}.rankA{color:#e8613c}.rankB{color:#2f78c4}.rankC{color:#3fae6a}.rankD{color:#7d7a85}
.order{background:#fff;border:3px solid var(--ink);border-radius:8px;padding:16px;position:relative;box-shadow:6px 6px 0 rgba(61,58,64,.18)}
.order .stamp{position:absolute;right:12px;top:10px;border:3px solid #d0453a;color:#d0453a;border-radius:50%;width:58px;height:58px;display:grid;place-items:center;font-weight:800;font-size:13px;transform:rotate(-12deg);line-height:1.1;text-align:center}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.chip{border:2.5px solid var(--ink);border-radius:99px;padding:4px 10px;font-size:14px;font-weight:800;background:#fff}
.chip.done{background:#9be0a8}.chip.now{background:var(--yellow)}
.arrow{font-weight:800;color:var(--muted)}
.talk{display:flex;gap:10px;align-items:flex-end}
.talk .face{width:76px;flex:none}
.bub{position:relative;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 12px;font-weight:800;font-size:15px;line-height:1.55}
.bub:before{content:"";position:absolute;left:-12px;bottom:14px;border:8px solid transparent;border-right:10px solid var(--ink)}
.bub small{display:block;font-size:12px;color:var(--accent)}
.tipsec{border-top:2px dashed rgba(61,58,64,.25);padding-top:10px;margin-top:10px}
.tipsec b{display:inline-block;font-size:13px;color:#fff;background:var(--ink);border-radius:8px;padding:1px 8px;margin-bottom:4px}
.tipsec.kotsu b{background:var(--accent)}
.tipsec p{margin:2px 0 0;font-size:16px;line-height:1.6;font-weight:800}
.ghead{padding:10px 12px 6px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--head);border-bottom:3px solid var(--ink)}
.ghead .flow{margin-top:0;gap:4px}
.ghead .chip{font-size:11px;padding:2px 7px}
.ghead .sname{font-size:17px;font-weight:800;margin-top:6px;display:flex;justify-content:space-between}
.coach{display:flex;align-items:center;gap:8px;padding:6px 12px;min-height:58px}
.coach .face{width:48px;flex:none}
.coach .bub{flex:1;font-size:14px;padding:6px 10px;min-height:38px;display:flex;align-items:center}
.coach .bub:before{bottom:10px}
.stage{flex:1;min-height:0;position:relative;overflow:hidden}
.stage canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;border-radius:16px;border:3px solid var(--ink);touch-action:none;background:#e7eef3}
.ctrl{padding:8px 14px calc(14px + env(safe-area-inset-bottom));border-top:3px solid var(--ink);background:var(--head)}
.ctrl .how{font-size:13px;font-weight:800;text-align:center;margin-bottom:8px;line-height:1.4}
.ctrl .btns{display:flex;gap:10px}
.ctrl .btns .btn{flex:1;font-size:19px;padding:14px 8px;touch-action:none}
.ctrl .btns .btn.sub{flex:.6;font-size:16px}
.score{font-size:64px;font-weight:800;line-height:1;text-align:center}
.score small{font-size:20px}
.stars{text-align:center;font-size:34px;letter-spacing:4px;color:#f2b705;text-shadow:2px 2px 0 var(--ink)}
.stars .off{color:#dfe5ea}
.rankbig{font-size:96px;font-weight:800;line-height:1;text-align:center;text-shadow:4px 4px 0 var(--ink)}
.steplist{width:100%;border-collapse:collapse;font-weight:800;font-size:15px}
.steplist td{padding:6px 4px;border-bottom:2px dashed rgba(61,58,64,.18)}
.steplist td:last-child{text-align:right;white-space:nowrap}
.bar{height:10px;background:#e3e9ee;border-radius:6px;overflow:hidden;border:2px solid var(--ink)}
.bar i{display:block;height:100%;background:var(--accent)}
.badge{display:inline-block;padding:3px 12px;border-radius:99px;border:3px solid var(--ink);font-weight:800;font-size:15px;margin:2px}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:2px dashed rgba(61,58,64,.2);font-weight:800;gap:10px}
.toggle{width:60px;height:34px;border-radius:99px;border:3px solid var(--ink);background:#ddd;position:relative;flex:none;cursor:pointer}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .15s}
.toggle.on{background:#9be0a8}.toggle.on:after{left:29px}
.fade{animation:fadein .3s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
.pop{animation:popin .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.3);opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ============================================================
   めざせ！ガラスのプロ — 板ガラス工場 新人研修ゲーム
   ============================================================ */
const $=s=>document.querySelector(s);
const app=$('#app');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
let clockFn=()=>performance.now()/1000;const now=()=>clockFn();
const L='#3d3a40';
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------------- sound ---------------- */
let AC=null,soundOn=store.get('plate_sound',true);
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.12,type='sine',vol=.15,slide=0,delay=0){if(!soundOn)return;const a=ac();if(!a)return;const t0=a.currentTime+delay;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+d+.02)}
let noiseBuf=null;
function getNoise(a){if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*2,a.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return noiseBuf}
function noiseBurst(d=.25,vol=.3,freq=3000){if(!soundOn)return;const a=ac();if(!a)return;const s=a.createBufferSource();s.buffer=getNoise(a);const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=freq;const g=a.createGain();g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);s.connect(f).connect(g).connect(a.destination);s.start();s.stop(a.currentTime+d)}
let hissSrc=null,hissGain=null,hissFilt=null;
function hiss(level,freq=900){const a=AC;if(!a)return;if(!hissSrc){if(level<=0)return;hissSrc=a.createBufferSource();hissSrc.buffer=getNoise(a);hissSrc.loop=true;hissFilt=a.createBiquadFilter();hissFilt.type='bandpass';hissFilt.Q.value=.7;hissGain=a.createGain();hissGain.gain.value=0;hissSrc.connect(hissFilt).connect(hissGain).connect(a.destination);hissSrc.start()}hissFilt.frequency.setTargetAtTime(freq,a.currentTime,.05);hissGain.gain.setTargetAtTime(soundOn?level*.06:0,a.currentTime,.06)}
const SFX={
  tap(){tone(660,.08,'triangle',.12)},
  good(){tone(784,.12,'triangle',.14);tone(1046,.2,'triangle',.14,0,.09)},
  perfect(){tone(784,.1,'triangle',.14);tone(988,.1,'triangle',.14,0,.08);tone(1318,.25,'triangle',.14,0,.16)},
  bad(){tone(240,.28,'sawtooth',.07,-90)},
  crack(){noiseBurst(.18,.35,2500);tone(1800,.08,'square',.05,-900)},
  pop(){tone(300,.15,'sine',.2,500)},
  clunk(){tone(140,.18,'square',.08,-40)},
  fanfare(){[523,659,784,1046].forEach((f,i)=>tone(f,.22,'triangle',.13,0,i*.12));tone(1318,.5,'triangle',.13,0,.5)},
};

/* ---------------- characters (2D deformed) ---------------- */
function chibi(who,mood='normal'){
  const skin='#ffe2c6';
  const cfg={boss:{jacket:'#3f6e8f',hair:'#cfcfcf'},pres:{jacket:'#46505c',hair:'#3a2a22'},me:{jacket:'#5b8fc9',hair:'#6b4430'}}[who];
  let s=`<svg viewBox="0 0 100 112" xmlns="http://www.w3.org/2000/svg" class="chibi" aria-hidden="true">`;
  s+=`<path d="M20 111 Q20 78 50 76 Q80 78 80 111 Z" fill="${cfg.jacket}" stroke="${L}" stroke-width="3" stroke-linejoin="round"/>`;
  if(who==='pres')s+=`<path d="M41 77 L50 91 L59 77" fill="#fff" stroke="${L}" stroke-width="2.5" stroke-linejoin="round"/><path d="M50 86 L45.5 104 L50 109 L54.5 104 Z" fill="#2f78c4" stroke="${L}" stroke-width="2" stroke-linejoin="round"/><path d="M36 79 L44 98 M64 79 L56 98" stroke="${L}" stroke-width="2.2"/>`;
  else s+=`<path d="M40 78 L50 88 L60 78" fill="none" stroke="${L}" stroke-width="2.5" stroke-linejoin="round"/><rect x="${who==='boss'?58:29}" y="92" width="13" height="9" rx="2" fill="#fff" stroke="${L}" stroke-width="2"/><path d="M24 100 H76" stroke="#ffd166" stroke-width="3" opacity=".9"/>`;
  s+=`<circle cx="19" cy="49" r="6" fill="${skin}" stroke="${L}" stroke-width="2.5"/><circle cx="81" cy="49" r="6" fill="${skin}" stroke="${L}" stroke-width="2.5"/>`;
  s+=`<circle cx="50" cy="45" r="31" fill="${skin}" stroke="${L}" stroke-width="3"/>`;
  const helmet=(col,mark)=>`<path d="M18 37 Q17 8 50 7 Q83 8 82 37 Z" fill="${col}" stroke="${L}" stroke-width="3" stroke-linejoin="round"/><path d="M50 8 V36" stroke="rgba(0,0,0,.12)" stroke-width="5"/><path d="M13 37 Q50 30 87 37 Q88 42 82 42 Q50 36 18 42 Q12 42 13 37 Z" fill="${col}" stroke="${L}" stroke-width="2.5" stroke-linejoin="round"/>${mark}`;
  if(who==='boss'){
    s+=`<path d="M20 47 Q16 36 22 30 L30 40 Z" fill="${cfg.hair}" stroke="${L}" stroke-width="2.5" stroke-linejoin="round"/><path d="M80 47 Q84 36 78 30 L70 40 Z" fill="${cfg.hair}" stroke="${L}" stroke-width="2.5" stroke-linejoin="round"/>`;
    s+=helmet('#fff',`<rect x="45" y="14" width="10" height="18" rx="1" fill="#2e9e5b"/><rect x="41" y="18" width="18" height="10" rx="1" fill="#2e9e5b"/>`);
  }else if(who==='pres'){
    s+=`<path d="M18 47 Q14 12 50 12 Q86 12 82 47 Q79 30 66 25 Q52 35 31 28 Q22 34 18 47 Z" fill="${cfg.hair}" stroke="${L}" stroke-width="3" stroke-linejoin="round"/>`;
  }else{
    s+=`<path d="M21 46 Q20 34 28 32 L72 32 Q80 34 79 46 Q72 38 58 40 L50 35 L42 40 Q28 38 21 46 Z" fill="${cfg.hair}" stroke="${L}" stroke-width="2.5" stroke-linejoin="round"/>`;
    s+=helmet('#ffd166',`<circle cx="50" cy="22" r="7" fill="#fff" stroke="${L}" stroke-width="2"/><path d="M47 22 L50 18 L53 22 L50 26 Z" fill="#3fae6a"/>`);
  }
  const ey=who==='boss'?50:49;
  if(mood==='happy')s+=`<path d="M35 ${ey+1} Q40 ${ey-6} 45 ${ey+1}" fill="none" stroke="${L}" stroke-width="3" stroke-linecap="round"/><path d="M55 ${ey+1} Q60 ${ey-6} 65 ${ey+1}" fill="none" stroke="${L}" stroke-width="3" stroke-linecap="round"/>`;
  else if(mood==='surprise')s+=`<circle cx="40" cy="${ey}" r="4.5" fill="#fff" stroke="${L}" stroke-width="2.5"/><circle cx="60" cy="${ey}" r="4.5" fill="#fff" stroke="${L}" stroke-width="2.5"/><circle cx="40" cy="${ey}" r="1.8" fill="${L}"/><circle cx="60" cy="${ey}" r="1.8" fill="${L}"/>`;
  else s+=`<ellipse cx="40" cy="${ey}" rx="3.2" ry="4.2" fill="${L}"/><ellipse cx="60" cy="${ey}" rx="3.2" ry="4.2" fill="${L}"/><circle cx="41" cy="${ey-1.5}" r="1.2" fill="#fff"/><circle cx="61" cy="${ey-1.5}" r="1.2" fill="#fff"/>`;
  if(mood==='worried')s+=`<path d="M34 ${ey-9} L45 ${ey-6}" stroke="${L}" stroke-width="2.5" stroke-linecap="round"/><path d="M66 ${ey-9} L55 ${ey-6}" stroke="${L}" stroke-width="2.5" stroke-linecap="round"/>`;
  if(who==='boss')s+=`<circle cx="40" cy="50" r="8.5" fill="rgba(255,255,255,.25)" stroke="${L}" stroke-width="2.3"/><circle cx="60" cy="50" r="8.5" fill="rgba(255,255,255,.25)" stroke="${L}" stroke-width="2.3"/><path d="M48.5 50 L51.5 50" stroke="${L}" stroke-width="2.3"/>`;
  s+=`<ellipse cx="31" cy="58" rx="5" ry="3" fill="#ff9f9f" opacity=".55"/><ellipse cx="69" cy="58" rx="5" ry="3" fill="#ff9f9f" opacity=".55"/>`;
  const my=who==='boss'?65:61;
  if(who==='boss')s+=`<path d="M38 61 Q44 56 50 59.5 Q56 56 62 61 Q56 64 50 62 Q44 64 38 61 Z" fill="${cfg.hair}" stroke="${L}" stroke-width="2" stroke-linejoin="round"/>`;
  if(mood==='happy')s+=`<path d="M43 ${my} Q50 ${my+10} 57 ${my} Z" fill="#d9534f" stroke="${L}" stroke-width="2.3" stroke-linejoin="round"/>`;
  else if(mood==='worried')s+=`<path d="M44 ${my+2} Q47 ${my-1} 50 ${my+2} Q53 ${my+5} 56 ${my+2}" fill="none" stroke="${L}" stroke-width="2.3" stroke-linecap="round"/>`;
  else if(mood==='surprise')s+=`<ellipse cx="50" cy="${my+2}" rx="3.5" ry="4.5" fill="#d9534f" stroke="${L}" stroke-width="2.3"/>`;
  else s+=`<path d="M45 ${my} Q50 ${my+5} 55 ${my}" fill="none" stroke="${L}" stroke-width="2.5" stroke-linecap="round"/>`;
  return s+`</svg>`;
}
const NAMES={boss:'工場長',pres:'社長',me:'新人（あなた）'};

/* ---------------- game data ---------------- */
const ST={
 cut:{type:'score',name:'切断',what:'大きな板ガラスの表面にカッターで「切り筋」を入れ、折って必要な大きさに切り分ける。',kotsu:'カッターは同じ力・同じ速さで、端から端まで一度で引き切る。途中で止めたり二度引きしたりすると、割れ方が乱れて欠けの原因になる。',how:'左端の▶から右端まで、点線の上を一定の速さでなぞる',p:{}},
 grind:{type:'grind',name:'面取り（研磨）',what:'切ったばかりの切り口は刃物のように鋭い。砥石に当てて角を落とし、なめらかにする。',kotsu:'押し付けが弱いと削り残し、強すぎると欠ける。ザラついた所は少し強めに。手に伝わる感触で加減する。',how:'長押しで砥石に押し付ける。圧力を緑の範囲に。オレンジのザラザラ部分は強めに',p:{dur:14,secs:[[.22,.36],[.6,.74]]}},
 print:{type:'print',name:'セラミック印刷',what:'スクリーン印刷で、ガラスの縁に黒い枠などの模様を、焼き付け用のインクで印刷する。',kotsu:'まず位置合わせ（トンボ合わせ）を正確に。スキージ（へら）は一定の速さで。速いとかすれ、遅いとにじむ。',how:'① ガラスをドラッグして＋を○に合わせ「合わせOK」 ② スキージを左から右へ一定の速さでなぞる',p:{band:[130,260]}},

function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
const GSTOPS=[[0,[200,232,248,.6]],[.4,[255,178,115,.85]],[.62,[255,138,42,.95]],[.8,[255,212,78,1]],[1,[255,252,228,1]]];
function glassRGB(h){h=clamp(h,0,1);for(let i=1;i<GSTOPS.length;i++){if(h<=GSTOPS[i][0]){const[a,ca]=GSTOPS[i-1],[b,cb]=GSTOPS[i];const k=(h-a)/(b-a);return ca.map((v,j)=>v+(cb[j]-v)*k)}}return GSTOPS[GSTOPS.length-1][1]}
function glassCol(h,am=1){const m=glassRGB(h);return`rgba(${m[0]|0},${m[1]|0},${m[2]|0},${(m[3]*am).toFixed(3)})`}

function resample(P,step=4){const out=[P[0]];let acc=0;for(let i=1;i<P.length;i++){let[ax,ay]=out[out.length-1];const[bx,by]=P[i];let d=Math.hypot(bx-ax,by-ay);while(d>=step){const k=step/d;ax=ax+(bx-ax)*k;ay=ay+(by-ay)*k;out.push([ax,ay]);d=Math.hypot(bx-ax,by-ay)}}const cum=[0];for(let i=1;i<out.length;i++)cum.push(cum[i-1]+Math.hypot(out[i][0]-out[i-1][0],out[i][1]-out[i-1][1]));return{pts:out,cum,total:cum[cum.length-1]}}
function rectShape(x,y,w,h,r){const P=[];const arc=(cx,cy,a0)=>{for(let i=0;i<=8;i++){const a=a0+i/8*Math.PI/2;P.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}};
  P.push([x,y+h-r]);arc(x+r,y+r,Math.PI);arc(x+w-r,y+r,-Math.PI/2);arc(x+w-r,y+h-r,0);arc(x+r,y+h-r,Math.PI/2);P.push([x,y+h-r]);return P}
function windShape(){const P=[];const q=(a,b,c,n)=>{for(let i=0;i<n;i++){const t=i/n;P.push([(1-t)**2*a[0]+2*(1-t)*t*b[0]+t*t*c[0],(1-t)**2*a[1]+2*(1-t)*t*b[1]+t*t*c[1]])}};
  const BL=[40,320],TL=[86,140],TR=[274,140],BR=[320,320];q(BL,[54,230],TL,30);q(TL,[180,104],TR,50);q(TR,[306,230],BR,30);q(BR,[180,346],BL,50);P.push(BL.slice());return P}
function pathFill(c,P){c.beginPath();P.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath()}

  start(){}down(x,y){}move(x,y){}up(x,y){}btn(k,d){}update(dt){}draw(c){}
  finish(score){if(this.done)return;this.done=true;this.score=Math.round(clamp(score,0,100));hiss(0)}
  pop(text,x,y,color='#e8613c',sz=24){this.fx.push({text,x,y,life:1.1,color,sz})}
  spark(x,y,n=12,col='#ffb347'){for(let i=0;i<n;i++)this.parts.push({x,y,vx:rand(-90,90),vy:rand(-160,-30),life:rand(.4,.9),col})}
  tickFx(dt){this.fx.forEach(f=>{f.life-=dt;f.y-=28*dt});this.fx=this.fx.filter(f=>f.life>0);this.parts.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=320*dt});this.parts=this.parts.filter(p=>p.life>0)}
  drawFx(c){this.parts.forEach(p=>{c.globalAlpha=clamp(p.life*1.6,0,1);c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,3,0,Math.PI*2);c.fill()});c.globalAlpha=1;

  }

/* --- 面取り（研磨） --- */
class Grind extends Mini{
  constructor(p){super(p);this.P=0;this.hold=false;this.inB=0;this.cnt=0;this.chips=0;this.chipAcc=0;this.res=[];this.spin=0}
  rough(u){return this.p.secs.some(([a,b])=>u>=a&&u<=b)}
  band(u){return this.rough(u)?[.62,.8]:[.36,.54]}
  down(){this.hold=true}up(){this.hold=false}btn(k,d){if(k==='press')this.hold=d}
  update(dt){
    const p=this.p;this.t+=dt;this.spin+=dt*14;const u=this.t/p.dur;
    this.P=clamp(this.P+(this.hold?1.05:-.95)*dt,0,1);hiss(.3+this.P*.7,1800);
    const[lo,hi]=this.band(u);let r='ok';
    if(this.P>hi+.1){this.chipAcc+=dt;r='over';if(this.chipAcc>.3){this.chipAcc=0;this.chips++;r='chip';SFX.crack();this.pop('欠け！',140,170,'#d0453a',20);coach('押しすぎ！欠けたぞ','surprise',true)}}
    else if(this.P<lo){r='rough'}else{this.inB+=dt;this.chipAcc=Math.max(0,this.chipAcc-dt)}
    this.cnt+=dt;this.res.push({u,r});
    if(this.P<lo-.05)coach(this.rough(u)?'ザラザラの所だ、もう少し強く！':'押し付けが弱い、削り残しになるぞ','surprise');
    else if(this.P>hi+.05)coach('強すぎる！欠けるぞ','surprise');
    else if(this.P>=lo&&this.P<=hi)coach('いい手ごたえだ、その調子','happy');
    if(u>=1)this.finish(this.inB/this.cnt*100-this.chips*7);
  }
  draw(c){
    const p=this.p;drawBg(c);timerBar(c,1-this.t/p.dur,'のこり');
    const u=this.t/p.dur,W=640,wx=180,wy=262,px=wx-u*W,py=150+this.P*6,ph=60;
    // plate (moving left)
    plate(c,px,py,W,ph);
    c.save();rr(c,px,py,W,ph,4);c.clip();
    for(const[a,b]of p.secs){const x0=px+a*W,x1=px+b*W;if(x1<wx){continue}c.fillStyle='rgba(255,154,90,.55)';c.fillRect(Math.max(x0,wx),py+ph-12,x1-Math.max(x0,wx),12);c.strokeStyle='#e8613c';c.lineWidth=2;for(let x=Math.max(x0,wx);x<x1;x+=8){c.beginPath();c.moveTo(x,py+ph);c.lineTo(x+4,py+ph-10);c.stroke()}}
    c.restore();
    // processed edge result
    c.lineWidth=4;for(let i=1;i<this.res.length;i+=2){const r=this.res[i],x=px+r.u*W;if(x<0||x>wx)continue;c.strokeStyle=r.r==='ok'?'#3fae6a':r.r==='rough'?'#e8a33c':'#d0453a';c.beginPath();c.moveTo(x,py+ph-1);c.lineTo(x+3,py+ph-1);c.stroke()}
    c.lineWidth=2;c.strokeStyle=L;c.fillStyle='#fff';
    // wheel
    c.save();c.translate(wx,wy+ (py-150));c.rotate(this.spin);c.beginPath();c.arc(0,0,48,0,Math.PI*2);c.fillStyle='#8b96a1';c.fill();c.lineWidth=3;c.strokeStyle=L;c.stroke();
    c.beginPath();c.arc(0,0,40,0,Math.PI*2);c.fillStyle='#b9c3cc';c.fill();c.stroke();for(let i=0;i<8;i++){const a=i/8*Math.PI*2;c.beginPath();c.arc(Math.cos(a)*44,Math.sin(a)*44,2.5,0,Math.PI*2);c.fillStyle='#fff';c.fill()}
    c.beginPath();c.arc(0,0,10,0,Math.PI*2);c.fillStyle=L;c.fill();c.restore();
    // water
    c.fillStyle='rgba(80,160,230,.7)';for(let i=0;i<6;i++){const k=(this.t*2+i/6)%1;c.beginPath();c.arc(wx-30+k*20+i*6,wy-60+k*40,2.5,0,Math.PI*2);c.fill()}
    gauge(c,334,70,250,this.P,this.band(u),'押し付け');
    const ahead=p.secs.find(([a])=>a>u&&a-u<.1);
    if(this.rough(u))label(c,'ザラザラ → 強めに！',110,90,14,'#ffe3d6','#d0453a');else if(ahead)label(c,'この先ザラザラ',110,90,14,'#fff3d6');else label(c,'一定の力で',110,90,14,'#dff3e3');
    txt(c,'欠け '+this.chips,60,360,14,this.chips?'#d0453a':L,'center','#fff');
  }
}

class Print extends Mini{
  constructor(p){super(p);this.phase='align';this.ox=rand(-36,36)||20;this.oy=rand(-26,26)||-15;if(Math.hypot(this.ox,this.oy)<18){this.ox=24;this.oy=-18}this.sx=40;this.bins=new Array(26).fill(null);this.lx=0;this.ly=0;this.lt=0;this.v=0}

    else if(this.phase==='squee'){if(this.t>40)this.endSq();const[lo,hi]=this.p.band;if(this.touch&&this.sx>50){if(this.v>hi*1.15)coach('速い！かすれるぞ','surprise');else if(this.v<lo*.85)coach('遅い！にじむぞ','surprise');else coach('いい速さだ','happy')}else coach('スキージを左から右へ、一定の速さで','normal');this.v*=Math.exp(-dt*3)}

function fitCanvas(){

function stepDone(g){
